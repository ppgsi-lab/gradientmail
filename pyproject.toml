[project]
name = "gradientmail"
dynamic = ["version"]
description = "Distributed training through asynchronous message exchange"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gabriel Francisco", email = "gabfssilva@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "safetensors>=0.8,<1",
]

[project.urls]
Homepage = "https://ppgsi-lab.github.io/gradientmail/"
Documentation = "https://ppgsi-lab.github.io/gradientmail/docs/guide/"
Repository = "https://github.com/ppgsi-lab/gradientmail"

[project.optional-dependencies]
s3 = ["boto3>=1.36"]
torch = ["torch"]
mlx = ["mlx"]
jax = ["jax"]
keras = ["keras"]
tensorflow = ["tensorflow"]
zstd = ["zstandard>=0.23"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-describe>=3",
    "hypothesis",
    "ruff",
    "pyrefly>=1.3",
    "moto[s3]>=5.1.5",
    "boto3>=1.36",
    "boto3-stubs-lite[s3]>=1.36",
    "zstandard>=0.23",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/gradientmail/_version.py"

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
describe_prefixes = ["describe", "when"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.12"
search-path = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["gradientmail.algorithms.Overwrite"]
