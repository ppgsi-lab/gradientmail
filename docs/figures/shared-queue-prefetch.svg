<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-label="A background thread lists units, claims the next one with put_if_absent and loads its batches in step order, then goes back for another unit. It fills a buffer of eight batches; six are ready, steps 61 to 66. session.run takes the oldest batch and passes it to train_step, which sets the learning rate for its step, trains and returns the samples it trained. When the buffer is full the thread waits; when no unclaimed unit is left it ends, and run drains the buffer and leaves the loop.">
<rect width="960" height="310" rx="6" class="ground"/>

<rect x="24" y="56" width="300" height="184" rx="6" class="card"/>
<text x="44" y="84" class="title">background thread</text>
<path d="M 46 168 H 36 V 112 H 47" class="loop"/>
<circle cx="56" cy="112" r="7" class="badge"/>
<text x="56" y="115.5" class="digit">1</text>
<text x="70" y="116" class="small">list <tspan class="code">units/</tspan>, skip the claimed ones</text>
<circle cx="56" cy="140" r="7" class="badge"/>
<text x="56" y="143.5" class="digit">2</text>
<text x="70" y="144" class="small">claim the next unit: <tspan class="code">put_if_absent</tspan></text>
<circle cx="56" cy="168" r="7" class="badge"/>
<text x="56" y="171.5" class="digit">3</text>
<text x="70" y="172" class="small"><tspan class="code">load(unit)</tspan>: its batches, in step order</text>
<text x="44" y="206" class="small muted">after the unit's last batch, back to 1</text>
<text x="44" y="222" class="small muted">no unclaimed unit left: the thread ends</text>

<path d="M 324 151 H 378" class="arrow"/>

<text x="498" y="116" class="code mid">prefetch=8</text>
<rect x="380" y="134" width="26" height="34" rx="4" class="slot"/>
<rect x="410" y="134" width="26" height="34" rx="4" class="slot"/>
<rect x="440" y="134" width="26" height="34" rx="4" class="slot-full"/>
<text x="453" y="155" class="code small mid">66</text>
<rect x="470" y="134" width="26" height="34" rx="4" class="slot-full"/>
<text x="483" y="155" class="code small mid">65</text>
<rect x="500" y="134" width="26" height="34" rx="4" class="slot-full"/>
<text x="513" y="155" class="code small mid">64</text>
<rect x="530" y="134" width="26" height="34" rx="4" class="slot-full"/>
<text x="543" y="155" class="code small mid">63</text>
<rect x="560" y="134" width="26" height="34" rx="4" class="slot-full"/>
<text x="573" y="155" class="code small mid">62</text>
<rect x="590" y="134" width="26" height="34" rx="4" class="slot-full"/>
<text x="603" y="155" class="code small mid">61</text>
<text x="498" y="190" class="small mid muted">batches ready, by step</text>
<text x="498" y="206" class="small mid muted">full: the thread waits</text>

<path d="M 620 151 H 674" class="arrow"/>

<rect x="676" y="56" width="260" height="184" rx="6" class="card"/>
<text x="696" y="84" class="title">training loop</text>
<text x="696" y="116" class="code">def train_step(item):</text>
<text x="722" y="134" class="code">step, batch = item</text>
<text x="722" y="152" class="code">lr = learning_rate(step)</text>
<text x="722" y="170" class="code">forward, backward, step</text>
<text x="722" y="188" class="code">return samples</text>
<text x="696" y="206" class="code">session.run(train_step, queue)</text>
<text x="696" y="222" class="small muted">drains the buffer, then leaves the loop</text>

<text x="24" y="272">While the GPU trains on one batch, the thread reads ahead, up to eight batches.</text>
<text x="24" y="290" class="small muted">A loader or mailbox error reaches the loop after the batches already buffered.</text>
</svg>
