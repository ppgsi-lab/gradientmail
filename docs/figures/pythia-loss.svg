<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Mean local training cross-entropy in nats per token against dataset step for 1, 2, 4, 8 and 16 replicas. A legend identifies every curve. One replica uses H = 50 and fp32; the distributed runs use H = 25 and F8 with zstd. The view shows loss below 5 after the initial drop. Dots mark the last logged 100-step bin, centered at step 3,950. At that bin: 1 replica 3.602; 2 replicas 3.590; 4 replicas 3.625; 8 replicas 3.673; 16 replicas 3.823. These are training losses, not held-out evaluation losses.">
