<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Two deltas of length 1, each 40 degrees from their mean direction, merged two ways with equal weights. The weighted mean cancels their sideways parts and has length 0.77, shorter than either delta. RDA averages the lengths and the directions separately and gives the mean direction the mean length, 1.">
<rect width="960" height="420" rx="6" class="ground"/>

<text x="48" y="48" class="title">Weighted mean</text>
<text x="48" y="68" class="small muted"><tspan class="m">Σ <tspan class="i">w</tspan><tspan class="sub i" dy="3">i</tspan><tspan dy="-3">Δ</tspan><tspan class="sub i" dy="3">i</tspan><tspan dy="-3"> / Σ </tspan><tspan class="i">w</tspan><tspan class="sub i" dy="3">i</tspan></tspan><tspan dy="-3">. The parts of the deltas that disagree cancel,</tspan></text>
<text x="48" y="84" class="small muted">so the merged step is shorter than either of them.</text>
<path d="M 90.4 204.4 A 220 220 0 0 1 401.6 204.4" class="guide"/>
<text x="408" y="226" class="small muted">length 1</text>
<path d="M 246 360 L 104.6 191.5" class="arrow-a strong"/>
<path d="M 246 360 L 387.4 191.5" class="arrow-b strong"/>
<path d="M 246 360 V 191.5" class="arrow-ink strong"/>
<circle cx="246" cy="360" r="3.5" class="dot-ink"/>
<text x="96" y="186" class="m end">Δ<tspan class="sub" dy="4">1</tspan></text>
<text x="396" y="186" class="m">Δ<tspan class="sub" dy="4">2</tspan></text>
<text x="246" y="178" class="small mid b">mean · length 0.77</text>

<path d="M 480 32 V 388" class="rule"/>

<text x="516" y="48" class="title">RDA, radial-directional averaging</text>
<text x="516" y="68" class="small muted">Average the lengths and the directions separately, then give</text>
<text x="516" y="84" class="small muted">the mean direction the mean length.</text>
<path d="M 558.4 204.4 A 220 220 0 0 1 869.6 204.4" class="guide"/>
<text x="876" y="226" class="small muted">length 1</text>
<path d="M 714 360 L 572.6 191.5" class="arrow-a strong"/>
<path d="M 714 360 L 855.4 191.5" class="arrow-b strong"/>
<path d="M 714 360 V 140" class="arrow-acc strong"/>
<path d="M 704 191.5 H 724" class="axis"/>
<circle cx="714" cy="360" r="3.5" class="dot-ink"/>
<text x="564" y="186" class="m end">Δ<tspan class="sub" dy="4">1</tspan></text>
<text x="864" y="186" class="m">Δ<tspan class="sub" dy="4">2</tspan></text>
<text x="714" y="126" class="small mid b acc">RDA · length 1.00</text>
<text x="730" y="195" class="small muted">weighted mean, 0.77</text>

<text x="24" y="404" class="small muted">Two deltas of length 1, 40° either side of their mean direction, equal weights. GradientMail merges most tensors with RDA and names containing “embed” with the weighted mean.</text>
</svg>
