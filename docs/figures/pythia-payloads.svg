<svg xmlns="http://www.w3.org/2000/svg" width="960" height="648" viewBox="0 0 960 648" role="img" aria-label="Measured payload sizes for the same Pythia-14M output-embedding update in FP32, BF16, FP8 and FP4, with and without zstd. Global commit update and complete-commit sizes share one decimal megabyte axis. The default FP32 commit stores the fragment and momentum; quantized commits also store an fp32 master and a separate update. Re-encoding round 456 does not measure the training quality of alternative formats.">
