<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="A grid of work units. Columns are groups of 20 dataset steps, 0–19 to 80–99 and onwards to step 4,000; rows are the four lanes, each a quarter of every step's 1,024 sequences. Each cell is one unit named by its group and lane, such as 000000-2.json. The highlighted unit, Unit(first=0, count=20, lane=2, lanes=4), is the third quarter of each batch at steps 0 to 19: 20 batches of 256 sequences. Any node can process any unit.">
