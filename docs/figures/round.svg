<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-label="Sequence of one round of a fragment, in five phases. Train: nodes A, B and C train from the anchor, version 3. Publish: A and C put their delta, anchor minus parameters, in the mailbox. Collect: the syncer elected for this round runs on node C; it lists and gets the deltas and checks their versions, reaches the quorum of two, and opens a grace window, inside which B's delta arrives and is fetched. Merge and commit: the syncer merges the deltas with RDA, applies the Nesterov outer step, puts version 4 with its outer state, and commits the round by creating its record once. Align: each node polls, gets version 4 and aligns with it between its steps, A first, then C, then B.">
<rect width="960" height="590" rx="6" class="ground"/>

<path d="M 24 124 H 936 M 24 188 H 936 M 24 308 H 936 M 24 412 H 936" class="rule"/>

<rect x="792" y="72" width="16" height="468" class="store"/>
<path d="M 260 72 V 540" class="life-a"/>
<path d="M 420 72 V 540" class="life-b"/>
<path d="M 580 72 V 540" class="life-c"/>

<rect x="210" y="28" width="100" height="44" rx="6" class="card"/>
<text x="260" y="55" class="title mid">Node A</text>
<rect x="370" y="28" width="100" height="44" rx="6" class="card"/>
<text x="420" y="55" class="title mid">Node B</text>
<rect x="510" y="28" width="140" height="44" rx="6" class="elected"/>
<text x="580" y="47" class="title mid">Node C</text>
<text x="580" y="63" class="small mid acc">elected syncer</text>
<rect x="730" y="28" width="140" height="44" rx="6" class="store-card"/>
<text x="800" y="47" class="title mid">Mailbox</text>
<text x="800" y="63" class="small mid muted">S3 · R2 · MinIO · HF</text>

<circle cx="31" cy="96" r="7" class="badge"/><text x="31" y="99.5" class="digit">1</text>
<text x="44" y="100" class="title">Train</text>
<text x="24" y="116" class="small muted">from the anchor, version 3</text>
<rect x="245" y="94" width="30" height="16" rx="8" class="pill"/><text x="260" y="106" class="small mid">v3</text>
<rect x="405" y="94" width="30" height="16" rx="8" class="pill"/><text x="420" y="106" class="small mid">v3</text>
<rect x="565" y="94" width="30" height="16" rx="8" class="pill"/><text x="580" y="106" class="small mid">v3</text>

<circle cx="31" cy="142" r="7" class="badge"/><text x="31" y="145.5" class="digit">2</text>
<text x="44" y="146" class="title">Publish</text>
<text x="24" y="162" class="small muted">Δ = anchor − θ, with the</text>
<text x="24" y="176" class="small muted">version, steps and samples</text>
<path d="M 263 152 H 791" class="arrow-a"/>
<text x="272" y="146" class="small">put Δ</text>
<path d="M 583 176 H 791" class="arrow-c"/>
<text x="592" y="170" class="small">put Δ</text>

<rect x="576" y="198" width="8" height="204" rx="4" class="xchg"/>

<circle cx="31" cy="206" r="7" class="badge"/><text x="31" y="209.5" class="digit">3</text>
<text x="44" y="210" class="title">Collect</text>
<text x="24" y="226" class="small muted">The syncer checks versions,</text>
<text x="24" y="240" class="small muted">waits for the quorum, then</text>
<text x="24" y="254" class="small muted">for a short grace window.</text>
<path d="M 585 212 H 791" class="arrow-acc"/>
<text x="596" y="206" class="small">list and get the Δs</text>
<rect x="596" y="220" width="150" height="34" rx="6" class="note"/>
<text x="606" y="234" class="small b acc">quorum: 2 of 3</text>
<text x="606" y="248" class="small">grace window opens</text>
<path d="M 423 272 H 791" class="arrow-b"/>
<text x="432" y="266" class="small">put Δ, inside the window</text>
<path d="M 585 296 H 791" class="arrow-acc"/>
<text x="596" y="290" class="small">get Δ</text>

<circle cx="31" cy="326" r="7" class="badge"/><text x="31" y="329.5" class="digit">4</text>
<text x="44" y="330" class="title">Merge and commit</text>
<text x="24" y="346" class="small muted">RDA merge, Nesterov outer</text>
<text x="24" y="360" class="small muted">step, version 4, then a</text>
<text x="24" y="374" class="small muted">create-once round record.</text>
<rect x="596" y="318" width="150" height="34" rx="6" class="note"/>
<text x="606" y="332" class="small">merge the Δs (RDA)</text>
<text x="606" y="346" class="small">Nesterov outer step</text>
<path d="M 585 372 H 791" class="arrow-acc"/>
<text x="596" y="366" class="small">put v4 + outer state</text>
<path d="M 585 398 H 791" class="arrow-acc"/>
<text x="596" y="392" class="small b acc">commit</text>
<rect x="795" y="393" width="10" height="10" rx="2" class="commit" transform="rotate(45 800 398)"/>
<text x="818" y="402" class="small acc">round record</text>

<circle cx="31" cy="430" r="7" class="badge"/><text x="31" y="433.5" class="digit">5</text>
<text x="44" y="434" class="title">Align</text>
<text x="24" y="450" class="small muted">Each node polls and aligns</text>
<text x="24" y="464" class="small muted">with version 4 between its</text>
<text x="24" y="478" class="small muted">own steps.</text>
<path d="M 263 436 H 791" class="arrow-a"/>
<text x="272" y="430" class="small">poll, get v4</text>
<rect x="245" y="446" width="30" height="16" rx="8" class="note"/><text x="260" y="458" class="small mid acc b">v4</text>
<path d="M 583 470 H 791" class="arrow-c"/>
<text x="592" y="464" class="small">poll, get v4</text>
<rect x="565" y="480" width="30" height="16" rx="8" class="note"/><text x="580" y="492" class="small mid acc b">v4</text>
<path d="M 423 506 H 791" class="arrow-b"/>
<text x="432" y="500" class="small">poll, get v4</text>
<rect x="405" y="516" width="30" height="16" rx="8" class="note"/><text x="420" y="528" class="small mid acc b">v4</text>

<text x="24" y="562" class="small muted">Every node runs a learner and a syncer; the syncer elected for this round runs on node C, its work in petrol on C's lifeline.</text>
<text x="24" y="578" class="small muted">Arrows are requests to the mailbox, in the color of what sends them; replies are not drawn.</text>
</svg>
