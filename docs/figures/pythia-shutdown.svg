<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="Timeline of the shutdown in the smoke test. At time zero the node closing rounds exits while it still holds the claim on the next round. A follower waits 150 seconds without a record, takes over, then meets the slow node's unreleased lease, which it had not tracked, and trusts it for another 120 seconds. A learner waiting in close() for its final round reaches its 270-second timeout and gives up; the round commits seconds later.">
<rect width="960" height="350" rx="6" class="ground"/>

<text x="24" y="40" class="title">Stopping the run: 150 s, then 120 s, against a 270 s timeout</text>
<text x="24" y="58" class="small muted">The learner waiting in close() gave up seconds before its final round committed.</text>

<text x="24" y="102" class="b">closer</text>
<text x="24" y="117" class="small muted">the node closing rounds</text>
<rect x="198.8" y="88" width="2.5" height="28" class="close"/>
<text x="212" y="106" class="small">exits, still holding the claim on the next round</text>

<text x="24" y="152" class="b">follower</text>
<text x="24" y="167" class="small muted">the node that takes over</text>
<rect x="200" y="142" width="349" height="20" rx="10" class="wait"/>
<text x="375" y="156" class="small mid halo">no record yet: waits 150 s</text>
<rect x="548.8" y="134" width="2.5" height="36" class="close"/>
<text x="550" y="128" class="small mid b">takes over</text>
<rect x="552" y="142" width="278" height="20" rx="10" class="lost"/>
<text x="691" y="156" class="small mid halo">the slow node's lease, new to it: 120 s</text>
<rect x="834" y="147" width="10" height="10" rx="2" class="commit" transform="rotate(45 839 152)"/>
<text x="839" y="128" class="small mid acc b">commit</text>

<text x="24" y="202" class="b">learner</text>
<text x="24" y="217" class="small muted">in close(), its last round</text>
<rect x="200" y="192" width="628" height="20" rx="10" class="wait"/>
<text x="514" y="206" class="small mid halo">waits for its final round to commit</text>
<path d="M 824 196 L 836 208 M 836 196 L 824 208" class="miss"/>
<text x="830" y="230" class="small mid sig b">gives up at 270 s</text>

<path d="M 200 252 H 900 M 200 252 V 257 M 316.7 252 V 257 M 433.3 252 V 257 M 550 252 V 257 M 666.7 252 V 257 M 783.3 252 V 257 M 900 252 V 257" class="axis"/>
<text x="200" y="270" class="small mid muted">0</text>
<text x="316.7" y="270" class="small mid muted">50</text>
<text x="433.3" y="270" class="small mid muted">100</text>
<text x="550" y="270" class="small mid muted">150</text>
<text x="666.7" y="270" class="small mid muted">200</text>
<text x="783.3" y="270" class="small mid muted">250</text>
<text x="900" y="270" class="small mid muted">300 s</text>

<path d="M 24 290 H 936" class="rule"/>
<text x="24" y="312">Fixed: close() releases its lease even when it must cancel a publish, and followers track leases on every poll</text>
<text x="24" y="330">and keep those observations when they take over, so an old lease gets no fresh waiting period.</text>
</svg>
