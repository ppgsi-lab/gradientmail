<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Eight fragment rows over 200 local steps, with sync_every = 100 and fragments = 8. DiLoCo exchanges every fragment together at steps 100 and 200, a single column. Streaming DiLoCo exchanges one fragment at a time, at steps 12, 25, 37, 50, 62, 75, 87 and 100 and again 100 steps later, a staircase: each fragment is still exchanged once every 100 steps, but each exchange carries an eighth of the model.">
<rect width="960" height="400" rx="6" class="ground"/>
<text x="24" y="40" class="code muted">gm.DiLoCo(sync_every=100, fragments=8)</text>

