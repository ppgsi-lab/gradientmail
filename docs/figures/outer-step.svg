<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Two number lines for the guide's example: the shared parameter Θ is 10 and two workers end at 8 and 6, so their outer gradients are 2 and 4, with mean 3. With plain outer SGD at learning rate 1, Θ moves by 3 to 7, the average of the workers. With Nesterov momentum at learning rate 0.7 and momentum 0.9, and a momentum of 3 left by an earlier round, the momentum becomes 5.7 and Θ moves by 5.69 to 4.31, past both workers.">
<rect width="960" height="320" rx="6" class="ground"/>

<text x="24" y="44" class="title">Outer SGD, <tspan class="var">η</tspan> = 1</text>
<text x="24" y="63" class="small muted">The step is the mean outer gradient, so Θ lands on the average of the workers.</text>
<path d="M 100 122 H 700" class="axis"/>
<path d="M 120 118 V 126 M 210 118 V 126 M 300 118 V 126 M 390 118 V 126 M 480 118 V 126 M 570 118 V 126 M 660 118 V 126" class="tick"/>
<path d="M 660 100 H 393" class="arrow-acc strong"/>
<text x="525" y="92" class="m mid acc">−<tspan class="i">η</tspan> · mean Δ = −3</text>
<circle cx="300" cy="122" r="6" class="sB"/>
<circle cx="480" cy="122" r="6" class="sA"/>
<circle cx="660" cy="122" r="6" class="dot-ink"/>
<circle cx="390" cy="122" r="6" class="dot-acc"/>
<text x="300" y="146" class="m mid"><tspan class="i">θ</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4"> = 6</tspan></text>
<text x="480" y="146" class="m mid"><tspan class="i">θ</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4"> = 8</tspan></text>
<text x="660" y="146" class="m mid">Θ = 10</text>
<text x="390" y="146" class="m mid acc">new Θ = 7</text>
<text x="752" y="104" class="m">Δ<tspan class="sub" dy="4">1</tspan><tspan dy="-4"> = 10 − 8 = 2</tspan></text>
<text x="752" y="124" class="m">Δ<tspan class="sub" dy="4">2</tspan><tspan dy="-4"> = 10 − 6 = 4</tspan></text>
<text x="752" y="144" class="m">mean Δ = 3</text>

<path d="M 24 172 H 936" class="rule"/>

<text x="24" y="200" class="title">Nesterov momentum, <tspan class="var">η</tspan> = 0.7, <tspan class="var">β</tspan> = 0.9 (GradientMail's defaults)</text>
<text x="24" y="219" class="small muted">With a momentum <tspan class="var">m</tspan> = 3 left by an earlier round, the step carries it and passes both workers.</text>
<path d="M 100 274 H 700" class="axis"/>
<path d="M 120 270 V 278 M 210 270 V 278 M 300 270 V 278 M 390 270 V 278 M 480 270 V 278 M 570 270 V 278 M 660 270 V 278" class="tick"/>
<path d="M 660 252 H 151" class="arrow-acc strong"/>
<text x="405" y="244" class="m mid acc">−<tspan class="i">η</tspan>(mean Δ + <tspan class="i">βm</tspan>) = −5.69</text>
<circle cx="300" cy="274" r="6" class="sB"/>
<circle cx="480" cy="274" r="6" class="sA"/>
<circle cx="660" cy="274" r="6" class="dot-ink"/>
<circle cx="148" cy="274" r="6" class="dot-acc"/>
<text x="300" y="298" class="m mid"><tspan class="i">θ</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4"> = 6</tspan></text>
<text x="480" y="298" class="m mid"><tspan class="i">θ</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4"> = 8</tspan></text>
<text x="660" y="298" class="m mid">Θ = 10</text>
<text x="148" y="298" class="m mid acc">new Θ = 4.31</text>
<text x="752" y="256" class="m"><tspan class="i">m</tspan> ← 0.9 · 3 + 3 = 5.7</text>
<text x="752" y="276" class="m">0.7 · (3 + 0.9 · 5.7) = 5.69</text>
</svg>
