<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Contour lines of the loss L = (2w + b − 6)² over the parameters w and b. The lines are parallel, and the loss is zero along the line 2w + b = 6. From the start (1, 0), where L = 16, the step −η times the gradient crosses the lines at a right angle. With η = 0.1 it lands at (2.6, 0.8) on the zero-loss line; with η = 0.25 it continues past the valley to (5, 2), where L = 36.">
<rect width="960" height="380" rx="6" class="ground"/>

<polygon points="96,96 114,96 222,312 96,312" class="band" fill-opacity="0.099"/>
