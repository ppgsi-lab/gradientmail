<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Training time against the number of replicas, both on logarithmic scales. One replica takes 7 h 52 min. The recipe takes 4 h 08 min with 2, 2 h 09 min with 4, 1 h 12 min with 8, 37 min with 16; Carry at H = 50 takes 4 h 35 min with 2, 2 h 15 min with 4, 1 h 09 min with 8, 36 min with 16. The dashed line is the ideal, the single-replica time divided by the replica count.">
