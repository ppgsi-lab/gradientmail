<svg xmlns="http://www.w3.org/2000/svg" width="960" height="546" viewBox="0 0 960 546" role="img" aria-labelledby="title desc">
  <title id="title">GradientMail: one synchronization round of a fragment</title>
  <desc id="desc">A small mailbox (S3-compatible object storage) holds the round's updates, one per learner, and its commit: the updated fragment and outer state. Learners A, B and C sit below it and every arrow points at the mailbox: the mailbox never calls a learner. Learner B has two arrows, one for its own requests as a learner and one for the merge. Each learner (1) puts its update for fragment k, the difference between the parameters it installed and the ones it trained, and (4) polls for commits and installs the committed fragment while it keeps training. Learner B, elected for this round, also runs the merge: (2) lists and gets the updates, merges them, applies the Nesterov outer step and (3) puts the commit: the updated fragment with its outer state. If B stalls another learner is elected.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3b5bdb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/>
    </marker>
    <g id="fragments">
      <rect x="0" y="0" width="11" height="10" rx="2" class="tile"/>
      <rect x="14" y="0" width="11" height="10" rx="2" class="tile"/>
      <rect x="28" y="0" width="11" height="10" rx="2" class="tile"/>
      <rect x="42" y="0" width="11" height="10" rx="2" class="tile"/>
      <rect x="56" y="0" width="11" height="10" rx="2" class="tile-k"/>
      <rect x="70" y="0" width="11" height="10" rx="2" class="tile"/>
      <rect x="84" y="0" width="11" height="10" rx="2" class="tile"/>
      <rect x="98" y="0" width="11" height="10" rx="2" class="tile"/>
    </g>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
      .h { font-size: 15px; font-weight: 700; }
      .muted { fill: #656d76; }
      .small { font-size: 11px; }
      .label { font-size: 11px; font-weight: 700; }
      .digit { font-size: 9px; font-weight: 700; fill: #ffffff; }
      .key { font-size: 11.5px; font-weight: 700; letter-spacing: 0.2px; }
      .blue { fill: #3b5bdb; }
      .teal { fill: #0f766e; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .elected { fill: #f0f8f6; stroke: #0f766e; stroke-width: 1.5; }
      .nested { fill: #ffffff; stroke: #0f766e; stroke-width: 1.25; }
      .slot { fill: #ffffff; stroke: #aab6ee; }
      .tile { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1; }
      .tile-k { fill: #3b5bdb; stroke: #3b5bdb; stroke-width: 1; }
      .wire { fill: none; stroke: #3b5bdb; stroke-width: 1.75; marker-end: url(#arrow); }
      .wire-teal { fill: none; stroke: #0f766e; stroke-width: 1.75; marker-end: url(#arrow-teal); }
      .spine { fill: none; stroke: #0f766e; stroke-width: 1.75; }
    </style>
  </defs>

  <rect width="960" height="546" rx="12" fill="#f6f8fa"/>

  <!-- Mailbox: stores the round's updates and its commit, no behaviour -->
  <rect x="380" y="32" width="200" height="116" rx="10" class="card"/>
  <text x="396" y="58" class="h">Mailbox</text>
  <text x="396" y="76" class="small muted">S3 · R2 · MinIO · HF Buckets</text>
  <text x="396" y="104" class="key blue">updates</text>
  <rect x="456" y="90" width="28" height="20" rx="4" class="slot"/>
  <text x="470" y="104" text-anchor="middle" class="label blue" font-size="10">ΔA</text>
  <rect x="488" y="90" width="28" height="20" rx="4" class="slot"/>
  <text x="502" y="104" text-anchor="middle" class="label blue" font-size="10">ΔB</text>
  <rect x="520" y="90" width="28" height="20" rx="4" class="slot"/>
  <text x="534" y="104" text-anchor="middle" class="label blue" font-size="10">ΔC</text>
  <text x="396" y="132" class="key teal">commit</text>
  <rect x="456" y="118" width="28" height="20" rx="4" fill="#ffffff" stroke="#9fd3c9"/>
  <text x="470" y="132" text-anchor="middle" class="label teal" font-size="10">Θ</text>
  <text x="490" y="132" class="small muted">+ outer state</text>

  <!-- Requests: every arrow starts at a learner -->
  <path d="M 170 220 V 190 H 400 V 148" class="wire"/>
  <path d="M 440 220 V 148" class="wire"/>
  <path d="M 520 220 V 148" class="wire-teal"/>
  <path d="M 790 220 V 190 H 560 V 148" class="wire"/>
  <rect x="266" y="181" width="38" height="18" rx="9" fill="#f6f8fa"/>
  <circle cx="277" cy="190" r="7" class="blue"/>
  <text x="277" y="193.5" text-anchor="middle" class="digit">1</text>
  <circle cx="293" cy="190" r="7" class="blue"/>
  <text x="293" y="193.5" text-anchor="middle" class="digit">4</text>
  <rect x="421" y="181" width="38" height="18" rx="9" fill="#f6f8fa"/>
  <circle cx="432" cy="190" r="7" class="blue"/>
  <text x="432" y="193.5" text-anchor="middle" class="digit">1</text>
  <circle cx="448" cy="190" r="7" class="blue"/>
  <text x="448" y="193.5" text-anchor="middle" class="digit">4</text>
  <rect x="501" y="181" width="38" height="18" rx="9" fill="#f6f8fa"/>
  <circle cx="512" cy="190" r="7" class="teal"/>
  <text x="512" y="193.5" text-anchor="middle" class="digit">2</text>
  <circle cx="528" cy="190" r="7" class="teal"/>
  <text x="528" y="193.5" text-anchor="middle" class="digit">3</text>
  <rect x="656" y="181" width="38" height="18" rx="9" fill="#f6f8fa"/>
  <circle cx="667" cy="190" r="7" class="blue"/>
  <text x="667" y="193.5" text-anchor="middle" class="digit">1</text>
  <circle cx="683" cy="190" r="7" class="blue"/>
  <text x="683" y="193.5" text-anchor="middle" class="digit">4</text>

  <!-- Learner A -->
  <rect x="40" y="220" width="260" height="120" rx="8" class="card"/>
  <text x="56" y="246" class="h">Learner A</text>
  <text x="56" y="266" class="muted">MLX · Apple silicon</text>
  <use href="#fragments" x="56" y="278"/>
  <text x="173" y="287" class="small muted">fragment k</text>
  <circle cx="62.5" cy="304.5" r="6.5" class="blue"/>
  <text x="62.5" y="307.5" text-anchor="middle" class="digit">1</text>
  <text x="74" y="308" class="small">put Δ = installed − trained</text>
  <circle cx="62.5" cy="322.5" r="6.5" class="blue"/>
  <text x="62.5" y="325.5" text-anchor="middle" class="digit">4</text>
  <text x="74" y="326" class="small">poll commits, install while training</text>

  <!-- Learner B, elected: trains like the others and runs the merge -->
  <rect x="320" y="220" width="320" height="294" rx="10" class="elected"/>
  <text x="336" y="246" class="h">Learner B</text>
  <rect x="562" y="233" width="62" height="19" rx="9.5" fill="#0f766e"/>
  <text x="593" y="246" text-anchor="middle" class="label" fill="#ffffff">elected</text>
  <text x="336" y="266" class="muted">PyTorch · H100</text>
  <use href="#fragments" x="336" y="278"/>
  <text x="453" y="287" class="small muted">fragment k</text>
  <circle cx="342.5" cy="304.5" r="6.5" class="blue"/>
  <text x="342.5" y="307.5" text-anchor="middle" class="digit">1</text>
  <text x="354" y="308" class="small">put Δ = installed − trained</text>

  <rect x="336" y="324" width="288" height="152" rx="8" class="nested"/>
  <rect x="350" y="318" width="52" height="13" fill="#f0f8f6"/>
  <text x="356" y="328" class="label teal">Merge</text>

  <path d="M 356 348 V 438" class="spine"/>
  <circle cx="356" cy="348" r="7" class="teal"/>
  <text x="356" y="351.5" text-anchor="middle" class="digit">2</text>
  <circle cx="356" cy="378" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <circle cx="356" cy="408" r="5" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <circle cx="356" cy="438" r="7" class="teal"/>
  <text x="356" y="441.5" text-anchor="middle" class="digit">3</text>
  <text x="372" y="352">list + get the round's Δs</text>
  <text x="372" y="382">merge the Δs (RDA)</text>
  <text x="372" y="412">Nesterov outer step</text>
  <text x="372" y="442">put commit: fragment + outer state</text>
  <text x="372" y="464" class="small muted">if B stalls, another is elected</text>

  <circle cx="342.5" cy="494.5" r="6.5" class="blue"/>
  <text x="342.5" y="497.5" text-anchor="middle" class="digit">4</text>
  <text x="354" y="498" class="small">poll commits, install while training</text>

  <!-- Learner C -->
  <rect x="660" y="220" width="260" height="120" rx="8" class="card"/>
  <text x="676" y="246" class="h">Learner C</text>
  <text x="676" y="266" class="muted">PyTorch · RTX 4090</text>
  <use href="#fragments" x="676" y="278"/>
  <text x="793" y="287" class="small muted">fragment k</text>
  <circle cx="682.5" cy="304.5" r="6.5" class="blue"/>
  <text x="682.5" y="307.5" text-anchor="middle" class="digit">1</text>
  <text x="694" y="308" class="small">put Δ = installed − trained</text>
  <circle cx="682.5" cy="322.5" r="6.5" class="blue"/>
  <text x="682.5" y="325.5" text-anchor="middle" class="digit">4</text>
  <text x="694" y="326" class="small">poll commits, install while training</text>
</svg>
