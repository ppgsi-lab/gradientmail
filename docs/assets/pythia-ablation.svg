<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Held-out loss at dataset step 4,000 of every eight-replica run. Carry, H = 25, F8 + zstd: the recipe, 3.601; Carry, H = 50, fp32, 3.678; Adaptive, H = 50, fp32, 3.705; Overwrite, H = 50, fp32, 3.723; Carry, H = 50, F8 + zstd, 3.733; Blend(0.5), H = 50, fp32, 3.770; Carry, H = 250, bf16, 3.836. One replica scores 3.585, the official checkpoint 3.781 and the nine PolyPythia seeds 3.732 to 3.762.">
<style>
svg { --paper: #fefdfc; --wash: #f5f1ec; --rule: #dedad5; --hatch: #cfc8c0; --muted: #665f5a; --ink: #1c1714; --accent: #065f74; --accent-wash: #e4f1f5; --on-accent: #ffffff; --signal: #86262e; --signal-wash: #fbeae9; --learner-a: #556892; --learner-b: #ac853f; --learner-c: #598361; --learner-d: #825172; --serif: "Newsreader", Georgia, "Times New Roman", serif; --math: "Source Serif 4", "Noto Sans Math", Georgia, serif; --sans: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { svg { --paper: #191512; --wash: #241f1c; --rule: #413c38; --hatch: #544f4a; --muted: #b3ada6; --ink: #eeebe5; --accent: #6ebccb; --accent-wash: #192f35; --on-accent: #191512; --signal: #e38182; --signal-wash: #3d2323; --learner-a: #899ecb; --learner-b: #d6ad68; --learner-c: #80b38a; --learner-d: #bd88ab; } }
@font-face { font-family: "Source Sans 3"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
/* The classes figure sources draw with. build.py prepends the theme's colors and font families as
   variables; a source sets no color or font of its own. */

text { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
.m { font-family: var(--math); font-size: 16px; }
.code { font-family: var(--mono); font-size: 12px; }
.title { font-size: 15px; font-weight: 600; }
.small { font-size: 11px; }
.sub { font-size: 11px; }
.big { font-size: 20px; }
.b { font-weight: 600; }
.i { font-style: italic; }
.var { font-family: var(--math); font-style: italic; font-size: 1.2em; }
.muted { fill: var(--muted); }
.acc { fill: var(--accent); }
.sig { fill: var(--signal); }
.on-accent { fill: var(--on-accent); }
.on-learner { fill: var(--paper); }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.digit { font-size: 9.5px; font-weight: 600; fill: var(--paper); text-anchor: middle; }
.halo { paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }

.ground, .backing { fill: var(--paper); }
.card { fill: var(--paper); stroke: var(--rule); stroke-width: 1.5; }
.store { fill: var(--wash); }
.store-card { fill: var(--wash); stroke: var(--rule); stroke-width: 1.5; }
.elected { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.5; }
.note { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.25; }
.note-a { fill: var(--paper); stroke: var(--learner-a); stroke-width: 1.25; }
.note-b { fill: var(--paper); stroke: var(--learner-b); stroke-width: 1.25; }
.note-c { fill: var(--paper); stroke: var(--learner-c); stroke-width: 1.25; }
.op { fill: var(--paper); stroke: var(--muted); stroke-width: 1.5; }
.out { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.param { fill: var(--wash); stroke: var(--ink); stroke-width: 1.5; }
.pill { fill: var(--paper); stroke: var(--rule); stroke-width: 1.25; }
.chip { fill: var(--accent); }
.tile, .layer, .slot-full { fill: var(--wash); stroke: var(--rule); stroke-width: 1; }
.slot { fill: var(--paper); stroke: var(--rule); stroke-width: 1.25; }
.tile-k { fill: var(--accent); }
.picked { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.5; }
.track { fill: var(--wash); }

.sA { fill: var(--learner-a); }
.sB { fill: var(--learner-b); }
.sC { fill: var(--learner-c); }
.sD { fill: var(--learner-d); }
.wait { fill: url(#hatch); }
.lost { fill: url(#lost); stroke: var(--signal); stroke-width: 1; }
.xchg, .commit, .dot-acc, .badge-acc { fill: var(--accent); }
.dot-ink, .badge, .close { fill: var(--ink); }
.dot-sig { fill: var(--signal); }
.dot-muted { fill: var(--muted); }
.snap { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.round { fill: var(--paper); stroke: var(--accent); stroke-width: 1.25; }
.miss { fill: none; stroke: var(--signal); stroke-width: 2.5; }
.band { fill: var(--accent); }
.ring { stroke: var(--paper); stroke-width: 1.5; }

.rule { fill: none; stroke: var(--rule); stroke-width: 1; }
.guide { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 4 4; }
.axis, .tick { fill: none; stroke: var(--muted); stroke-width: 1; }
.contour { fill: none; stroke: var(--hatch); stroke-width: 1; }
.frame { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.valley { fill: none; stroke: var(--accent); stroke-width: 2; }
.span { fill: none; stroke: var(--accent); stroke-width: 1; }
.join { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.batches { stroke: var(--accent); stroke-width: 0.75; stroke-opacity: 0.45; }
.life-a { stroke: var(--learner-a); stroke-width: 2.5; }
.life-b { stroke: var(--learner-b); stroke-width: 2.5; }
.life-c { stroke: var(--learner-c); stroke-width: 2.5; }
.life-s { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; }
.line-a { fill: none; stroke: var(--learner-a); stroke-width: 1.25; }
.line-b { fill: none; stroke: var(--learner-b); stroke-width: 1.25; }
.line-c { fill: none; stroke: var(--learner-c); stroke-width: 1.25; }
.line-d { fill: none; stroke: var(--learner-d); stroke-width: 1.25; }
.dotted { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 1 3; stroke-linecap: round; }
.line-ink { fill: none; stroke: var(--ink); stroke-width: 2; }
.line-sig { fill: none; stroke: var(--signal); stroke-width: 2; }
.line-muted { fill: none; stroke: var(--muted); stroke-width: 2; }
.line-acc { fill: none; stroke: var(--accent); stroke-width: 2; }
.thin { stroke-width: 1; stroke-opacity: 0.6; }

.arrow { fill: none; stroke: var(--muted); stroke-width: 1.5; marker-end: url(#head-muted); }
.arrow-ink { fill: none; stroke: var(--ink); stroke-width: 1.5; marker-end: url(#head-ink); }
.arrow-acc { fill: none; stroke: var(--accent); stroke-width: 1.5; marker-end: url(#head-accent); }
.arrow-sig { fill: none; stroke: var(--signal); stroke-width: 1.5; marker-end: url(#head-signal); }
.arrow-a { fill: none; stroke: var(--learner-a); stroke-width: 1.5; marker-end: url(#head-a); }
.arrow-b { fill: none; stroke: var(--learner-b); stroke-width: 1.5; marker-end: url(#head-b); }
.arrow-c { fill: none; stroke: var(--learner-c); stroke-width: 1.5; marker-end: url(#head-c); }
.reply { fill: none; stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 4 3; marker-end: url(#head-muted); }
.strong { stroke-width: 2.5; }
.loop { fill: none; stroke: var(--muted); stroke-width: 1.25; marker-end: url(#head-muted); }

.hatch-bg { fill: var(--wash); }
.hatch-line { stroke: var(--hatch); stroke-width: 2.5; }
.lost-bg { fill: var(--signal-wash); }
.lost-line { stroke: var(--signal); stroke-opacity: 0.4; stroke-width: 2.5; }
.head-ink { fill: var(--ink); }
.head-muted { fill: var(--muted); }
.head-accent { fill: var(--accent); }
.head-signal { fill: var(--signal); }
.head-a { fill: var(--learner-a); }
.head-b { fill: var(--learner-b); }
.head-c { fill: var(--learner-c); }
</style>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hatch-bg"/><path d="M 0 0 V 6" class="hatch-line"/></pattern><pattern id="lost" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="lost-bg"/><path d="M 0 0 V 6" class="lost-line"/></pattern><marker id="head-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" class="head-ink"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" class="head-muted"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" class="head-accent"/></marker><marker id="head-signal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" class="head-signal"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" class="head-a"/></marker><marker id="head-b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" class="head-b"/></marker><marker id="head-c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" class="head-c"/></marker></defs>
